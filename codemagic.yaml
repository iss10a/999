workflows:
  android-release:
    name: Android NDK Release
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      java: 17
      vars:
        NDK_VERSION: "27.2.12479018"

    scripts:
      - name: Inspect project
        script: |
          set -euxo pipefail
          pwd
          find . -maxdepth 2 -type f | sort | head -200

      - name: Install Android NDK
        script: |
          set -euxo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Build project
        script: |
          set -euxo pipefail
          export NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export PATH="$NDK_ROOT:$PATH"

          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh
          elif [ -f "./Android.mk" ]; then
            "$NDK_ROOT/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk
          else
            echo "ERROR: build.sh or Android.mk not found."
            exit 1
          fi

      - name: Collect APK
        script: |
          set -euxo pipefail
          mkdir -p build_artifacts
          find . -type f -name "*.apk" -exec cp -v {} build_artifacts/ \;

          if ! find build_artifacts -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

    artifacts:
      - build_artifacts/*.apk
      - "**/build/outputs/**/*.apk"
      - "**/libs/**/*.so"
