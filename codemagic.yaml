workflows:
  android-release:
    name: Android NDK Release
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      java: 17

    scripts:
      - name: Unzip project archive
        script: |
          set -euxo pipefail
          if [ -f "libexploits-project.zip" ]; then
            echo "Unzipping libexploits-project.zip..."
            unzip -o -q libexploits-project.zip -d .
          elif [ -f "*.zip" ]; then
            echo "Unzipping available zip file..."
            unzip -o -q *.zip -d .
          fi

      - name: Inspect project after unzip
        script: |
          set -euxo pipefail
          pwd
          find . -maxdepth 2 -type f | sort | head -200

      - name: Setup Android NDK
        script: |
          set -euxo pipefail
          # إضافة مسار cmdline-tools لاستخدام sdkmanager إذا لزم الأمر
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          
          # تثبيت NDK في حال عدم وجوده
          yes | sdkmanager --install "ndk;27.2.12479018" || true

      - name: Build project
        script: |
          set -euxo pipefail
          
          # البحث عن مسار NDK المثبت تلقائياً في النظام
          if [ -d "$ANDROID_HOME/ndk-bundle" ]; then
            export NDK_ROOT="$ANDROID_HOME/ndk-bundle"
          elif [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            export NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          else
            export NDK_ROOT="$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)"
          fi

          echo "Using NDK from: $NDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export PATH="$NDK_ROOT:$PATH"

          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh
          elif [ -f "./Android.mk" ]; then
            "$NDK_ROOT/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk
          else
            echo "ERROR: Neither build.sh nor Android.mk was found after unzipping."
            exit 1
          fi

      - name: Collect APK
        script: |
          set -euxo pipefail
          mkdir -p build_artifacts
          find . -type f -name "*.apk" -exec cp -v {} build_artifacts/ \;

          if ! find build_artifacts -type f -name "*.apk" | grep -q .; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

    artifacts:
      - build_artifacts/*.apk
      - "**/build/outputs/**/*.apk"
      - "**/*.so"
